version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: safemind-rabbitmq
    restart: always
    ports:
      - "5672:5672"    # Porta AMQP padrão
      - "15672:15672"  # Painel de Gerenciamento Web (http://localhost:15672 - user: guest, pass: guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
