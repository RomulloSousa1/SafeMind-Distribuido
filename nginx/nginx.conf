events {
    worker_connections 1024;
}

http {
    log_format safemind '$remote_addr "$request" $status upstream=$upstream_addr';
    access_log /dev/stdout safemind;

    # O nome do serviço resolve para os IPs das 3 réplicas (DNS do Docker).
    # Algoritmo: Round Robin (padrão do Nginx).
    upstream cluster_avaliacoes {
        server servico-avaliacoes:3001 max_fails=1 fail_timeout=5s;
    }

    upstream cluster_cadastros {
        server servico-cadastros:3002;
    }

    upstream cluster_autenticacao {
        server servico-autenticacao:3003;
    }

    server {
        listen 80;
        server_name localhost;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Upstream $upstream_addr always;

        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 2s;

        location /api/auth/ {
            proxy_pass http://cluster_autenticacao;
        }

        # Rotas de negócio (prefixo /api/negocio/ é removido antes de repassar)
        location /api/negocio/avaliacoes {
            rewrite ^/api/negocio/(.*)$ /api/$1 break;
            proxy_pass http://cluster_avaliacoes;
        }

        location ~ ^/api/negocio/(empresas|colaboradores) {
            rewrite ^/api/negocio/(.*)$ /api/$1 break;
            proxy_pass http://cluster_cadastros;
        }

        # Rotas legadas, mantidas por compatibilidade
        location /api/avaliacoes {
            proxy_pass http://cluster_avaliacoes;
        }

        location /api/empresas {
            proxy_pass http://cluster_cadastros;
        }

        location /api/colaboradores {
            proxy_pass http://cluster_cadastros;
        }

        location /health {
            default_type application/json;
            return 200 '{"status":"UP","gateway":"nginx"}';
        }
    }
}
